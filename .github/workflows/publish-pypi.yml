---
name: Build and Publish to PyPI

# Builds the PyPI distribution and publishes it. Triggered automatically when
# a GitHub release is published. Simplified version of the hydromt-core workflow.

on:
  release:
    types:
      - published

defaults:
  run:
    shell: bash -e -l {0}

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install flit twine

      - name: Build artifacts
        run: |
          git clean -xdf
          git restore -SW .
          flit build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: releases
          path: dist

  test-built-dist:
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: releases
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify the built dist/wheel is valid
        run: |
          python -m pip install dist/hydromt*.whl
          hydromt --models

  upload-to-pypi:
    needs: test-built-dist
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: releases
          path: dist
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          verbose: true
          skip-existing: false
