meta:
  root: None

1D_boundaries_timeseries:
  uri: local_data/boundaries.geojson
  driver:
    options:
      data_path: boundaries_series.csv
    name: geodataset_vector
  metadata:
    crs: 32647
  data_type: GeoDataset
  root: None

1D_branches:
  uri: local_data/1D_rivers.geojson
  data_adapter:
    rename:
      BRANCH_ID: branchid
      BR_TYPE: branchtype
  driver:
    name: pyogrio
  metadata:
    crs: 32647
  data_type: GeoDataFrame
  root: None

1D_bridges_defaults:
  uri: structures/bridges_defaults.csv
  driver:
    name: pandas
  metadata:
    notes: default bridge parameters.
  data_type: DataFrame
  root: None

1D_culverts_defaults:
  uri: structures/culverts_defaults.csv
  driver:
    name: pandas
  metadata:
    notes: default culvert parameters.
  data_type: DataFrame
  root: None

1D_laterals_polygons_timeseries:
  uri: local_data/laterals_polygons.geojson
  data_adapter:
    rename:
      1D_laterals_polygons_timeseries: lateral_discharge
  driver:
    options:
      data_path: laterals_series.csv
      assert_gtype: Polygon
    name: geodataset_vector
  metadata:
    crs: 32647
  data_type: GeoDataset
  root: None

1D_laterals_timeseries:
  uri: local_data/laterals_points.geojson
  data_adapter:
    rename:
      1D_laterals_timeseries: lateral_discharge
  driver:
    options:
      data_path: laterals_series.csv
    name: geodataset_vector
  metadata:
    crs: 32647
  data_type: GeoDataset
  root: None

1D_rivers_pointcrosssections:
  uri: local_data/1D_rivers_pointcrosssections.geojson
  data_adapter:
    rename:
      id: crsid
      TYPE: shape
      WIDTH: width
      HEIGHT: height
      BEDLEVEL: shift
  driver:
    name: pyogrio
  metadata:
    crs: 32647
  data_type: GeoDataFrame
  root: None

1D_rivers_xyzcrosssections:
  uri: local_data/1D_rivers_xyzcrosssections.geojson
  data_adapter:
    rename:
      ORDER: order
      CRS_ID: crsid
      Z: z
  driver:
    name: pyogrio
  metadata:
    crs: 32647
  data_type: GeoDataFrame
  root: None

1d_bridges:
  uri: local_data/bridges.geojson
  data_adapter:
    rename:
      STRUC_ID: structure_id
      STRUC_TYPE: structure_type
      SHAPE: shape
      WIDTH: width
      HEIGHT: height
      CLOSED: closed
      BEDLEV: shift
      LENGTH: length
      FLOW_DIR: allowedflowdir
      IN_LOSS: inletlosscoeff
      OUT_LOSS: outletlosscoeff
  driver:
    name: pyogrio
  metadata:
    crs: 32647
  data_type: GeoDataFrame
  root: None

1d_culverts:
  uri: local_data/culverts.geojson
  data_adapter:
    rename:
      STRUC_ID: structure_id
      STRUC_TYPE: structure_type
      SHAPE: shape
      WIDTH: width
      HEIGHT: height
      CLOSED: closed
      INVLEV_UP: leftlevel
      INVLEV_DN: rightlevel
      FLOW_DIR: allowedflowdir
  driver:
    name: pyogrio
  metadata:
    crs: 32647
  data_type: GeoDataFrame
  root: None

1d_manholes:
  uri: local_data/manholes.geojson
  data_adapter:
    rename:
      ID: manholeid
      AREA: area
      STR_AREA: streetArea
  driver:
    name: pyogrio
  metadata:
    crs: 32647
  data_type: GeoDataFrame
  root: None

2D_boundary:
  uri: local_data/2d_boundary.geojson
  driver:
    name: pyogrio
  metadata:
    crs: 32647
    notes: created by buffer the extent by aqrt(2) * res. Must contain boundary_id
      if timeseries is specified
  data_type: GeoDataFrame
  root: None

2D_boundary_timeseries:
  uri: local_data/2dboundaries_series.csv
  driver:
    options:
      index_col: time
      parse_dates: true
      dayfirst: true
    name: pandas
  metadata:
    notes: time series data for the 2D boundary, must contain time as index and boundary_id
      as columns
  data_type: DataFrame
  root: None

dem:
  uri: local_data/dem.tif
  data_adapter:
    rename:
      dem: elevtn
  driver:
    options: {}
    name: rasterio
  metadata:
    crs: 4326
    category: dem
    history: temporary dem within model extent
  data_type: RasterDataset
  root: None

manholes_defaults:
  uri: storages/manholes_defaults.csv
  driver:
    name: pandas
  metadata:
    notes: default manhole parameters.
  data_type: DataFrame
  root: None

meteo_timeseries_T2:
  uri: local_data/rainfall_series.csv
  data_adapter:
    rename:
      T2_mm/day: rainfall_rate
  driver:
    options:
      index_col: 0
      parse_dates: true
    name: pandas
  metadata:
    unit: mm day-1
  data_type: DataFrame
  root: None

pipes_defaults:
  uri: branches/pipes_defaults.csv
  driver:
    name: pandas
  metadata:
    notes: default pipe parameters.
  data_type: DataFrame
  root: None

rivers_defaults:
  uri: branches/rivers_defaults.csv
  driver:
    name: pandas
  metadata:
    notes: default river parameters.
  data_type: DataFrame
  root: None
