modeltype: dflowfm

global:
  crs: 32647
  network_snap_offset: 25
  openwater_computation_node_distance: 40
  snap_newbranches_to_branches_at_snapnodes: false

steps:
  - setup_urban_sewer_network_from_osm:
      region:
        geom: 'examples\data\local_data\region.geojson'
      dem_fn: dem
      landuse_fn: landuse
      landuse_reclass_fn: vito_mapping
      runoff_distance: 30.0
      method_cost: length
      pipe_depth: 0.5
      assumption_rainfall_intensity: 40
      assumption_flow_velocity: 1
      rainfall_stats_fn: gpex